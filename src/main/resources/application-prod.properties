# Activate with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# REQUIRED for deployments — keeps schema/data scripts from re-running on restart.
spring.thymeleaf.cache=true
logging.level.com.mahavircourier=INFO
logging.level.org.springframework=WARN

# On real deployments run schema.sql once, then keep SQL init off (default here).
# Override only if you intentionally need init: SQL_INIT_MODE=always
spring.sql.init.mode=${SQL_INIT_MODE:never}

server.error.include-message=never
server.error.include-stacktrace=never
