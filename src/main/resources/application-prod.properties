# Activate with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
spring.thymeleaf.cache=true
logging.level.com.mahavircourier=INFO
logging.level.org.springframework=WARN

# On real deployments run schema.sql once, then set SQL_INIT_MODE=never so the
# app doesn't try to touch the schema on every restart.
spring.sql.init.mode=${SQL_INIT_MODE:never}

server.error.include-message=never
server.error.include-stacktrace=never
