spring.application.name=mahavir-courier

# ---------------------------------------------------------------------------
# Database (MySQL). Values are overridable via environment variables so the
# same jar can be promoted from dev -> staging -> prod without code changes.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mahavir_courier?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootroot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (production sizing)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=MahavirHikariPool

# ---------------------------------------------------------------------------
# Schema / seed data. Local default is "always" (idempotent CREATE TABLE IF NOT
# EXISTS + guarded inserts). Deployments MUST activate the prod profile so this
# becomes "never":
#   java -jar mahavir-courier.jar --spring.profiles.active=prod
#   or: export SPRING_PROFILES_ACTIVE=prod
# ---------------------------------------------------------------------------
spring.sql.init.continue-on-error=false
spring.sql.init.mode=always

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.compression.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.mahavircourier=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.jdbc.core=${JDBC_LOG_LEVEL:INFO}

# App specific
app.tracking.id-length=10
app.company.name=Express Corporation of India

# ---------------------------------------------------------------------------
# Email (Gmail SMTP). Set MAIL_USERNAME + MAIL_PASSWORD (Gmail App Password).
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:amansinghtomar2209@gmail.com}
spring.mail.password=${MAIL_PASSWORD:atpjblcizakgpcml}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:amantomar786@gmail.com}}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.always-bcc=${MAIL_ALWAYS_BCC:amansinghtomar2209@gmail.com}

# ---------------------------------------------------------------------------
# SMS (Twilio). Set TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER.
# ---------------------------------------------------------------------------
app.sms.enabled=${SMS_ENABLED:true}
app.sms.provider=${SMS_PROVIDER:twilio}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---------------------------------------------------------------------------
# Scheduled operational reports emailed to management
# ---------------------------------------------------------------------------
app.report.email=${REPORT_EMAIL:amansinghtomar2209@gmail.com}
app.report.scheduler-enabled=${REPORT_SCHEDULER_ENABLED:true}
app.report.daily.cron=${REPORT_DAILY_CRON:0 0 8 * * *}
app.report.weekly.cron=${REPORT_WEEKLY_CRON:0 0 8 * * MON}
app.report.monthly.cron=${REPORT_MONTHLY_CRON:0 0 8 1 * *}

# ---------------------------------------------------------------------------
# Monitoring / Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
app.monitor.alert-email=${REPORT_EMAIL:amansinghtomar2209@gmail.com}
app.monitor.delayed-threshold=${MONITOR_DELAYED_THRESHOLD:1}
app.monitor.unpaid-cod-threshold=${MONITOR_UNPAID_COD_THRESHOLD:1}
app.monitor.failed-notify-threshold=${MONITOR_FAILED_NOTIFY_THRESHOLD:1}
app.monitor.alert-cron=${MONITOR_ALERT_CRON:0 0/30 * * * *}
